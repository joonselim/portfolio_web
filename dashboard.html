<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Portfolio · Dashboard</title>
  <style>
    :root {
      --paper:  #F6F2EA;
      --paper-2:#EFE9DC;
      --ink:    #17140F;
      --ink-2:  #3A352C;
      --ink-3:  #6B6557;
      --rule:   #D9D1BE;
      --navy:   #1C2B4A;
      --amber:  #C9641C;
      --mono:   ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace;
      --sans:   -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    a { color: var(--navy); }

    /* ── Gate ─────────────────────────────────────────────── */
    .gate {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .gate-card {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border: 1px solid var(--rule);
      border-radius: 14px;
      padding: 36px 32px;
    }
    .gate-card .eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--ink-3);
    }
    .gate-card h1 {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -.02em;
      margin: 10px 0 24px;
    }
    .gate-card input {
      width: 100%;
      font: inherit;
      font-size: 15px;
      padding: 12px 14px;
      border: 1px solid var(--rule);
      border-radius: 8px;
      background: var(--paper);
      outline: none;
    }
    .gate-card input:focus { border-color: var(--navy); }
    .gate-card button {
      width: 100%;
      margin-top: 12px;
      font: inherit;
      font-weight: 600;
      font-size: 15px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: var(--navy);
      color: #fff;
      cursor: pointer;
    }
    .gate-card button:disabled { opacity: .5; cursor: default; }
    .gate-err {
      margin-top: 12px;
      font-size: 13px;
      color: #b22;
      min-height: 18px;
    }

    /* ── Dashboard ────────────────────────────────────────── */
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 28px 80px;
    }
    .head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--rule);
    }
    .head .eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--ink-3);
    }
    .head h1 {
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -.02em;
      margin-top: 6px;
    }
    .head .links {
      font-size: 13px;
      text-align: right;
      line-height: 1.7;
    }
    .head .links a { display: block; }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin: 24px 0 28px;
    }
    .stat {
      background: #fff;
      border: 1px solid var(--rule);
      border-radius: 12px;
      padding: 18px 20px;
    }
    .stat .k {
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--ink-3);
    }
    .stat .v {
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -.02em;
      margin-top: 6px;
    }
    .stat .v small { font-size: 14px; color: var(--ink-3); font-weight: 400; }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .toolbar input {
      flex: 1;
      font: inherit;
      font-size: 14px;
      padding: 9px 12px;
      border: 1px solid var(--rule);
      border-radius: 8px;
      background: #fff;
      outline: none;
    }
    .toolbar input:focus { border-color: var(--navy); }
    .toolbar .meta { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
    .toolbar button {
      font: inherit; font-size: 13px;
      padding: 9px 14px;
      border: 1px solid var(--rule);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border: 1px solid var(--rule);
      border-radius: 12px;
      overflow: hidden;
    }
    thead th {
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--ink-3);
      text-align: left;
      padding: 12px 16px;
      border-bottom: 1px solid var(--rule);
      background: var(--paper-2);
    }
    tbody td {
      padding: 13px 16px;
      border-bottom: 1px solid var(--rule);
      font-size: 14px;
      vertical-align: top;
    }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: var(--paper-2); }
    td.when { white-space: nowrap; font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
    td.where { white-space: nowrap; font-size: 13px; }
    td.where .flag { color: var(--navy); font-weight: 600; }
    td.q { font-weight: 500; }
    td.q .answer {
      margin-top: 6px;
      font-size: 12.5px;
      font-weight: 400;
      color: var(--ink-3);
      line-height: 1.5;
      display: none;
    }
    td.q.open .answer { display: block; }
    td.q .toggle {
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--navy);
      cursor: pointer;
      margin-top: 4px;
      display: inline-block;
    }
    .empty {
      padding: 48px;
      text-align: center;
      color: var(--ink-3);
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- ── Password gate ─────────────────────────────────────── -->
  <div class="gate" id="gate">
    <form class="gate-card" id="gateForm">
      <div class="eyebrow">Joonse Lim · Portfolio</div>
      <h1>Analytics dashboard</h1>
      <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus>
      <button type="submit" id="gateBtn">Unlock</button>
      <div class="gate-err" id="gateErr"></div>
    </form>
  </div>

  <!-- ── Dashboard (hidden until unlocked) ─────────────────── -->
  <div class="wrap" id="dash" style="display:none;">
    <div class="head">
      <div>
        <div class="eyebrow">Joonse Lim · Portfolio</div>
        <h1>Chatbot questions</h1>
      </div>
      <div class="links">
        <a href="https://vercel.com/dashboard" target="_blank" rel="noreferrer">↗ Vercel Web Analytics (visits &amp; geo)</a>
        <a href="/" rel="noreferrer">↗ Back to the portfolio</a>
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <input type="text" id="filter" placeholder="Filter questions, country, city…">
      <span class="meta" id="meta"></span>
      <button id="refresh" type="button">Refresh</button>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width:150px;">When</th>
          <th style="width:160px;">Where</th>
          <th>Question</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none;">No questions logged yet.</div>
  </div>

  <script>
    var EVENTS = [];

    function fmtTime(ts) {
      var d = new Date(ts);
      var now = Date.now();
      var diff = now - ts;
      var rel;
      if (diff < 60000) rel = 'just now';
      else if (diff < 3600000) rel = Math.floor(diff / 60000) + 'm ago';
      else if (diff < 86400000) rel = Math.floor(diff / 3600000) + 'h ago';
      else rel = Math.floor(diff / 86400000) + 'd ago';
      var stamp = d.toLocaleString(undefined, {
        month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit',
      });
      return { stamp: stamp, rel: rel };
    }

    function flag(cc) {
      if (!cc || cc.length !== 2) return '';
      return String.fromCodePoint.apply(null,
        cc.toUpperCase().split('').map(function (c) { return 0x1f1a5 + c.charCodeAt(0); }));
    }

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function render(list) {
      var rows = document.getElementById('rows');
      var empty = document.getElementById('empty');
      rows.innerHTML = '';
      if (!list.length) { empty.style.display = 'block'; return; }
      empty.style.display = 'none';
      list.forEach(function (e) {
        var t = fmtTime(e.ts);
        var loc = [e.city, e.country].filter(Boolean).join(', ') || 'unknown';
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td class="when">' + esc(t.stamp) + '<br><span style="opacity:.65">' + esc(t.rel) + '</span></td>' +
          '<td class="where"><span class="flag">' + flag(e.country) + ' ' + esc(loc) + '</span></td>' +
          '<td class="q">' + esc(e.question) +
            (e.answer ? '<span class="toggle">show answer ▾</span><div class="answer">' + esc(e.answer) + '</div>' : '') +
          '</td>';
        var q = tr.querySelector('td.q');
        var tog = tr.querySelector('.toggle');
        if (tog) tog.addEventListener('click', function () {
          q.classList.toggle('open');
          tog.textContent = q.classList.contains('open') ? 'hide answer ▴' : 'show answer ▾';
        });
        rows.appendChild(tr);
      });
    }

    function renderStats() {
      var total = EVENTS.length;
      var countries = {};
      var last24 = 0;
      var cutoff = Date.now() - 86400000;
      EVENTS.forEach(function (e) {
        if (e.country) countries[e.country] = 1;
        if (e.ts >= cutoff) last24++;
      });
      var nCountries = Object.keys(countries).length;
      var lastTs = total ? EVENTS[0].ts : 0;
      var lastRel = lastTs ? fmtTime(lastTs).rel : '—';
      var cards = [
        { k: 'Total questions', v: total },
        { k: 'Last 24 hours', v: last24 },
        { k: 'Countries', v: nCountries },
        { k: 'Most recent', v: '<small>' + esc(lastRel) + '</small>' },
      ];
      document.getElementById('stats').innerHTML = cards.map(function (c) {
        return '<div class="stat"><div class="k">' + c.k + '</div><div class="v">' + c.v + '</div></div>';
      }).join('');
    }

    function applyFilter() {
      var q = document.getElementById('filter').value.trim().toLowerCase();
      var list = !q ? EVENTS : EVENTS.filter(function (e) {
        return (
          (e.question || '').toLowerCase().indexOf(q) > -1 ||
          (e.country || '').toLowerCase().indexOf(q) > -1 ||
          (e.city || '').toLowerCase().indexOf(q) > -1 ||
          (e.answer || '').toLowerCase().indexOf(q) > -1
        );
      });
      document.getElementById('meta').textContent =
        list.length + ' of ' + EVENTS.length + ' shown';
      render(list);
    }

    function load(pw) {
      return fetch('/api/dashboard', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pw: pw }),
      }).then(function (r) {
        if (r.status === 401) throw new Error('Wrong password.');
        if (!r.ok) return r.json().then(function (d) { throw new Error(d.error || ('Error ' + r.status)); });
        return r.json();
      }).then(function (data) {
        // newest first (LPUSH already does this, but be safe)
        EVENTS = (data.events || []).sort(function (a, b) { return b.ts - a.ts; });
        renderStats();
        applyFilter();
      });
    }

    // ── Gate flow ──────────────────────────────────────────
    var sessionPw = sessionStorage.getItem('dash_pw') || '';

    function unlock(pw) {
      var btn = document.getElementById('gateBtn');
      var err = document.getElementById('gateErr');
      btn.disabled = true; err.textContent = '';
      load(pw).then(function () {
        sessionStorage.setItem('dash_pw', pw);
        document.getElementById('gate').style.display = 'none';
        document.getElementById('dash').style.display = 'block';
      }).catch(function (e) {
        err.textContent = e.message;
        btn.disabled = false;
        sessionStorage.removeItem('dash_pw');
      });
    }

    document.getElementById('gateForm').addEventListener('submit', function (ev) {
      ev.preventDefault();
      unlock(document.getElementById('pw').value);
    });
    document.getElementById('filter').addEventListener('input', applyFilter);
    document.getElementById('refresh').addEventListener('click', function () {
      load(sessionStorage.getItem('dash_pw') || '').catch(function (e) {
        alert(e.message);
      });
    });

    // Auto-unlock if we already have a password this session.
    if (sessionPw) unlock(sessionPw);
  </script>
</body>
</html>
